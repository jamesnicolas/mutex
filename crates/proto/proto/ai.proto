syntax = "proto3";
package zed.messages;

import "task.proto";

message GetAgentServerCommand {
  uint64 project_id = 1;
  string name = 2;
  optional string root_dir = 3;
}

message GetContextServerCommand {
  uint64 project_id = 1;
  string server_id = 2;
  optional string root_dir = 3;
}

message ContextServerCommand {
  string path = 1;
  repeated string args = 2;
  map<string, string> env = 3;
}

message AgentServerCommand {
  string path = 1;
  repeated string args = 2;
  map<string, string> env = 3;
  string root_dir = 4;

  optional SpawnInTerminal login = 5;
}

message ExternalAgentsUpdated {
  uint64 project_id = 1;
  repeated string names = 2;
}

message ExternalExtensionAgentTarget {
  string archive = 1;
  string cmd = 2;
  repeated string args = 3;
  optional string sha256 = 4;
  map<string, string> env = 5;
}

message ExternalExtensionAgent {
  string name = 1;
  optional string icon_path = 2;
  string extension_id = 3;
  map<string, ExternalExtensionAgentTarget> targets = 4;
  map<string, string> env = 5;
  optional string version = 6;
}

message ExternalExtensionAgentsUpdated {
  uint64 project_id = 1;
  repeated ExternalExtensionAgent agents = 2;
}

message ExternalAgentLoadingStatusUpdated {
  uint64 project_id = 1;
  string name = 2;
  reserved 3;
  optional string status = 4;
}

message NewExternalAgentVersionAvailable {
  uint64 project_id = 1;
  string name = 2;
  string version = 3;
}

message ShareAgentThread {
  string session_id = 1; // Client-generated UUID (acp::SessionId)
  string title = 2;
  bytes thread_data = 3;
}

message GetSharedAgentThread {
  string session_id = 1; // UUID string
}

message GetSharedAgentThreadResponse {
  string title = 1;
  bytes thread_data = 2;
  string sharer_username = 3;
  string created_at = 4;
}

message AgentThreadPathList {
  string paths = 1;
  string order = 2;
}

message AgentThreadMetadata {
  string thread_id = 1;
  optional string session_id = 2;
  string agent_id = 3;
  optional string title = 4;
  optional string title_override = 5;
  optional string parallel_attempt_group = 6;
  optional string landed = 7;
  int64 updated_at_millis = 8;
  optional int64 created_at_millis = 9;
  optional int64 interacted_at_millis = 10;
  AgentThreadPathList folder_paths = 11;
  AgentThreadPathList main_worktree_paths = 12;
  optional string remote_connection_json = 13;
  bool archived = 14;
  bool server_hosted = 15;
}

message ListAgentThreads {
  uint64 project_id = 1;
}

message ListAgentThreadsResponse {
  repeated AgentThreadMetadata threads = 1;
}

message UpsertAgentThread {
  uint64 project_id = 1;
  AgentThreadMetadata thread = 2;
}

message RemoveAgentThread {
  uint64 project_id = 1;
  string thread_id = 2;
}

message AgentThreadUpdated {
  uint64 project_id = 1;
  AgentThreadMetadata thread = 2;
}

message AgentThreadRemoved {
  uint64 project_id = 1;
  string thread_id = 2;
}

message UpdateAgentCredentials {
  string access_token = 1;
  string refresh_token = 2;
  optional uint64 expires_at_ms = 3;
  optional string account_id = 4;
  optional string email = 5;
}

message AgentCredentialsUpdated {
  string access_token = 1;
  string refresh_token = 2;
  optional uint64 expires_at_ms = 3;
  optional string account_id = 4;
  optional string email = 5;
}

message CreateAgentSession {
  AgentThreadMetadata thread_metadata = 1;
}

message CreateAgentSessionResponse {
  string session_id = 1;
}

message AgentSessionPrompt {
  string session_id = 1;
  string prompt_markdown = 2;
}

message AgentSessionCancel {
  string session_id = 1;
}

message RespondAgentToolAuthorization {
  string session_id = 1;
  string approval_id = 2;
  string selected_outcome_json = 3;
}

message SerializedAgentThreadEvent {
  string variant = 1;
  optional string payload_json = 2;
  string debug = 3;
}

message BufferedAgentSessionEvent {
  uint64 sequence = 1;
  SerializedAgentThreadEvent event = 2;
}

message SubscribeAgentSession {
  string session_id = 1;
  uint64 from_sequence = 2;
}

message SubscribeAgentSessionResponse {
  uint64 snapshot_sequence = 1;
  bool gap = 2;
  repeated SerializedAgentThreadEvent snapshot = 3;
  repeated BufferedAgentSessionEvent events = 4;
}

message AgentSessionEvent {
  string session_id = 1;
  uint64 sequence = 2;
  SerializedAgentThreadEvent event = 3;
}
